services:
  roon:
    image: steefdebruijn/docker-roonserver:latest
    container_name: roon
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      # Connect database to persistent NFS storage
      - /mnt/data/roon:/var/roon
      # Backups to backup-share
      - /mnt/backups/roon:/backup
      # Music read-only
      - /mnt/media/music:/music:ro
